[project]
name = "coreview-backend"
version = "0.1.0"
description = "CoReview backend: Word drafting assistant API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "agent-framework>=1.1.0",
    "azure-identity>=1.19.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
